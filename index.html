<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1,maximum-scale=1,user-scalable=0,viewport-fit=cover">
  <title>Zam MINI App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>

<body id="body" class="p-3">

  <div id="loadingPopup" class="position-fixed top-0 start-0 w-100 h-100 bg-dark bg-opacity-75 d-none flex-column justify-content-center align-items-center text-white" style="z-index: 9999;">
    <div class="card p-4 bg-dark border-secondary text-center shadow-lg" style="max-width: 300px; width: 85%;">
      <div class="spinner-border text-primary mx-auto mb-3" role="status" style="width: 3rem; height: 3rem;">
        <span class="visually-hidden">Loading...</span>
      </div>
      <h5 class="mb-1">Sending Data</h5>
      <p class="text-muted small mb-0">Please wait a moment...</p>
    </div>
  </div>

  <div class="container text-center max-width-sm" style="max-width: 500px; margin: 0 auto;">
    
    <section id="profile" class="mb-4">
      <img id="pictureUrl" src="https://vos.line-scdn.net/imgs/apis/ic_mini.png" class="rounded-circle mx-auto d-block mb-3" style="width: 120px; height: 120px; object-fit: cover;">
      <p id="userId" class="border-bottom border-dashed pb-2 text-start small text-break"></p>
      <p id="displayName" class="border-bottom border-dashed pb-2 text-start"></p>
      <p id="statusMessage" class="border-bottom border-dashed pb-2 text-start"></p>
      <p id="email" class="border-bottom border-dashed pb-2 text-start"></p>
    </section>

    <section id="feature" class="mb-4 text-start">
      <p id="code" class="border-bottom border-dashed pb-2"></p>
      <p id="friendShip" class="border-bottom border-dashed pb-2"></p>
    </section>

    <div id="resultContainer" class="card d-none border-primary text-start mb-4 shadow-sm">
      <div class="card-header bg-primary text-white py-2">
        <h5 class="mb-0 text-center" id="resultTitle">Attendance Result</h5>
      </div>
      <div class="card-body py-3">
        <div class="row mb-2 border-bottom pb-1">
          <div class="col-6 fw-bold text-muted">Name:</div>
          <div class="col-6 text-end fw-semibold" id="resName">-</div>
        </div>
        <div class="row mb-2 border-bottom pb-1">
          <div class="col-6 fw-bold text-muted">Student No.:</div>
          <div class="col-6 text-end fw-semibold" id="resStudentNo">-</div>
        </div>
        <div class="row mb-2 border-bottom pb-1">
          <div class="col-6 fw-bold text-muted">Distance (M.):</div>
          <div class="col-6 text-end fw-semibold" id="resDistance">-</div>
        </div>
        <div class="row mb-2 border-bottom pb-1">
          <div class="col-6 fw-bold text-muted">Result:</div>
          <div class="col-6 text-end fw-bold text-success" id="resResult">-</div>
        </div>
        <div class="row">
          <div class="col-6 fw-bold text-muted">Time:</div>
          <div class="col-6 text-end fw-bold text-success" id="resTimestamp">-</div>
        </div>
      </div>
    </div>

    <section id="button" class="d-grid gap-2">
      <button id="btnSend" class="btn btn-primary lg" style="display: none;">Send Message</button>
      <button id="btnScanCode" class="btn btn-info text-white" style="display: none;">Scan Code</button>
      <button id="btnLogIn" class="btn btn-success" style="display: none;">Log In</button>
      <button id="btnLogOut" class="btn btn-danger" style="display: none;">Log Out</button>
    </section>

  </div>

  <script>
    const body = document.querySelector('#body');

    // UI elements
    const btnLogIn = document.querySelector('#btnLogIn');
    const btnLogOut = document.querySelector('#btnLogOut');
    const btnSend = document.querySelector('#btnSend');
    const btnScanCode = document.querySelector('#btnScanCode');

    const email = document.querySelector('#email');
    const userId = document.querySelector('#userId');
    const pictureUrl = document.querySelector('#pictureUrl');
    const displayName = document.querySelector('#displayName');
    const statusMessage = document.querySelector('#statusMessage');

    // Popup & Result elements
    const loadingPopup = document.querySelector('#loadingPopup');
    const resultContainer = document.querySelector('#resultContainer');
    const resName = document.querySelector('#resName');
    const resStudentNo = document.querySelector('#resStudentNo');
    const resDistance = document.querySelector('#resDistance');
    const resResult = document.querySelector('#resResult');
    const resTimestamp = document.querySelector('#resTimestamp');

    const code = document.querySelector('#code');
    const friendShip = document.querySelector('#friendShip');

    let userProfileCached = null;

    async function main() {
      await liff.init({ liffId: '2010108184-EahiB3i0' });

      switch (liff.getOS()) {
        case 'android':
          body.style.backgroundColor = '#d1f5d3';
          break;
        case 'ios':
          body.style.backgroundColor = '#eeeeee';
          break;
        case 'web':
          body.style.backgroundColor = '#195AEA';
          body.classList.add('text-white');
          break;
      }

      if (liff.isInClient()) {
        getUserProfile();
        getFriendship();
        btnSend.style.display = 'block';
        btnScanCode.style.display = 'block';
      } else {
        if (liff.isLoggedIn()) {
          btnLogIn.style.display = 'none';
          btnLogOut.style.display = 'block';
          btnScanCode.style.display = 'block';
          btnSend.style.display = 'block';
          getUserProfile();
          getFriendship();
        } else {
          btnLogIn.style.display = 'block';
          btnLogOut.style.display = 'none';
        }
      }
    }

    main();

    async function getUserProfile() {
      const profile = await liff.getProfile();
      userProfileCached = profile;
      pictureUrl.src = profile.pictureUrl ? profile.pictureUrl : 'https://vos.line-scdn.net/imgs/apis/ic_mini.png';
      userId.innerHTML = '<b>userId:</b> ' + profile.userId;
      statusMessage.innerHTML = '<b>statusMessage:</b> ' + profile.statusMessage;
      displayName.innerHTML = '<b>displayName:</b> ' + profile.displayName;
      email.innerHTML = '<b>email:</b> ' + liff.getDecodedIDToken().email;
    }

    btnLogIn.onclick = () => { liff.login(); };
    btnLogOut.onclick = () => { liff.logout(); window.location.reload(); };
    btnSend.onclick = () => { sendMsg(); };
    btnScanCode.onclick = () => { scanCode(); };

    // Helper functions to cleanly control popup visibility
    function showLoading() {
      loadingPopup.classList.remove('d-none');
      loadingPopup.classList.add('d-flex');
    }

    function hideLoading() {
      loadingPopup.classList.add('d-none');
      loadingPopup.classList.remove('d-flex');
    }

    async function sendMsg() {
      // Trigger the popup animation overlay
      showLoading();
      resultContainer.classList.add('d-none');

      const coords = await getLocation();
      if (!coords[0] || !coords[1] || !coords[2]) {
        hideLoading();
        alert("No Location!!!");
        return;
      }

      let idTk = await liff.getIDToken();
      const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzupOxiP7VZy9dy5EzUOQ4dRwqbK1WfffqKdGOyJFSF63TUSjaVhbnV77Cr6X1X8_gJVA/exec";

      const urlWithParams = new URL(GAS_WEB_APP_URL);
      urlWithParams.searchParams.append("idToken", idTk);
      urlWithParams.searchParams.append("coordsX", coords[0]);
      urlWithParams.searchParams.append("coordsY", coords[1]);
      urlWithParams.searchParams.append("coordsAcc", coords[2]);

      try {    
        const response = await fetch(urlWithParams, {
          method: "GET", 
          redirect: "follow", 
          headers: { "Content-Type": "text/plain;charset=utf-8" }
        });

        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }

        const responseData = await response.json();
        console.log("Response from server:", responseData);

        const mappedName = responseData.name || "-";
        const mappedStudentNo = responseData.studentNo || "-";
        const mappedDistance = Math.round(responseData.distance) || "-";
        const mappedResult = responseData.result || "-";
        const mappedTimestamp = new Date(parseInt(responseData.timestamp)+7*60*60*1000).toLocaleDateString("th-TH", {year: '2-digit',  month: 'short',  day: 'numeric', hour: "numeric",minute: "numeric",second: "numeric"}) || "-";

        resName.textContent = mappedName;
        resStudentNo.textContent = mappedStudentNo;
        resDistance.textContent = mappedDistance;
        resResult.textContent = mappedResult;
        resTimestamp.textContent = mappedTimestamp;
        

        // Dismiss the popup modal before displaying results
        hideLoading();
        resultContainer.classList.remove('d-none');

        if (liff.isInClient() || liff.isLoggedIn()) {
          await liff.sendMessages([
            {
              type: "flex",
              altText: "Attendance Result",
              contents: {
                type: "bubble",
                body: {
                  type: "box",
                  layout: "vertical",
                  contents: [
                    /*{
                      type: "text",
                      text: "Attendance Result",
                      weight: "bold",
                      size: "md",
                      color: "#195AEA"
                    },*/
                    {
                      type: "box",
                      layout: "horizontal",
                      margin: "lg",
                      contents: [
                        { type: "text", text: (mappedName+" "+mappedStudentNo.split("-")[1]), color: "#0c06c7", size: "sm" },
                        { type: "text", text: (mappedResult=="in"?"มา":"ขาด"), align: "end", size: "sm", weight: "bold", color: (mappedResult=="in"?"#056517":"#bf1029") }
                      ]
                    }
                  ]
                }
              }
            }
          ]);
          console.log("Flex message sent successfully!");
        }

      } catch (error) {
        hideLoading();
        console.error("Fetch Error:", error);
        alert("Error occurred: " + error.message);
      }
    }

    async function scanCode() {
      const result = await liff.scanCodeV2();
      code.innerHTML = '<b>Code: </b>' + result.value;
    }

    async function getFriendship() {
      let msg = 'Hooray! You and our chatbot are friends.';
      const friend = await liff.getFriendship();
      if (!friend.friendFlag) {
        msg = '<a href="https://line.me/R/ti/p/@171kguff" class="btn btn-sm btn-outline-primary mt-1">Follow our chatbot here!</a>';
      }
      friendShip.innerHTML = msg;
    }

    async function getLocation() {
      if (!navigator.geolocation) { return [,,]; }
      try {
        const options = { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 };
        const position = await new Promise((resolve, reject) => {
          navigator.geolocation.getCurrentPosition(resolve, reject, options);
        });
        return [position.coords.latitude, position.coords.longitude, position.coords.accuracy];
      } catch (error) {
        return [,,]; 
      }
    }
  </script>
</body>
</html>
